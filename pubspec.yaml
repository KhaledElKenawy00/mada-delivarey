name: madar
description: "مدار — نظام إدارة التوزيع والمبيعات الميدانية للمناديب"
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State + navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Backend
  supabase_flutter: ^2.6.0

  # Device licensing (بصمة الجهاز)
  device_info_plus: ^10.1.2
  android_id: ^0.4.0
  crypto: ^3.0.3
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # GPS + map
  geolocator: ^13.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # UI + utils
  google_fonts: ^6.2.1
  intl: any
  uuid: ^4.5.0
  connectivity_plus: ^6.0.5

  # استيراد Excel
  excel: ^4.0.6
  file_picker: ^8.1.2

  # طباعة على طابعة Sunmi المدمجة (V2 / V2s / L2 / P2 …)
  sunmi_printer_plus: ^4.1.0

  # طباعة A4 (PDF) — من أي شاشة، موبايل أو ديسكتوب
  pdf: ^3.11.1
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Cairo-Regular.ttf
