name: Build & Release

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.2"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Write Supabase env.json
        shell: bash
        run: |
          cat > env.json <<EOF
          {
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY }}"
          }
          EOF

      - run: flutter build apk --release -t lib/main_mobile.dart --dart-define-from-file=env.json

      - run: cp build/app/outputs/flutter-apk/app-release.apk madar-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: madar-android
          path: madar-android.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter config --enable-windows-desktop

      - run: flutter pub get

      - name: Write Supabase env.json
        shell: bash
        run: |
          cat > env.json <<EOF
          {
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY }}"
          }
          EOF

      - run: flutter build windows --release -t lib/main_desktop.dart --dart-define-from-file=env.json

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer\madar.iss

      - uses: actions/upload-artifact@v4
        with:
          name: madar-desktop-windows
          path: installer_output/madar-setup.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev

      - run: flutter config --enable-linux-desktop

      - run: flutter pub get

      - name: Write Supabase env.json
        shell: bash
        run: |
          cat > env.json <<EOF
          {
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY }}"
          }
          EOF

      - run: flutter build linux --release -t lib/main_desktop.dart --dart-define-from-file=env.json

      - name: Package bundle
        run: |
          mkdir -p package
          cp -r build/linux/x64/release/bundle package/bundle
          cp linux/packaging/madar.png package/madar.png
          cp linux/packaging/install.sh package/install.sh
          chmod +x package/install.sh
          tar -czf madar-linux.tar.gz -C package .

      - uses: actions/upload-artifact@v4
        with:
          name: madar-desktop-linux
          path: madar-linux.tar.gz

  release:
    needs: [build-android, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          cp artifacts/madar-android/madar-android.apk release/
          cp artifacts/madar-desktop-windows/madar-setup.exe release/
          cp artifacts/madar-desktop-linux/madar-linux.tar.gz release/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Madar — build #${{ github.run_number }}"
          generate_release_notes: true
          files: release/*
